[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-devops-toolkit"
version = "1.1.0"
description = "A streamlined, modular DevOps pipeline toolkit for building, testing, deploying, and verifying smart contracts across multiple blockchain networks."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Web3 DevOps Team" }
]
dependencies = [
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
web3-devops = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
